name: Release

# Publishes the archives built by the Build workflow, so a release always ships the exact
# binaries that were tested rather than a rebuild.
#
# Releases are meant to be immutable, which is a repository setting this workflow cannot
# turn on: enable Settings → General → "Immutable releases" so publishing locks the tag and
# the assets and GitHub issues its own release attestation. The steps below are ordered for
# it — assets are complete and attested before anything is published, because a published
# release can no longer be corrected.

permissions:
  contents: read

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed
    branches:
      - main

concurrency:
  # One release at a time, repository wide: two runs publishing the same version would race
  # over the same draft and tag.
  group: release
  # Build cancels superseded runs, and a cancelled Build never reaches this workflow. Once a
  # release run starts it must finish, because cancelling between uploading the assets and
  # publishing leaves a draft behind.
  cancel-in-progress: false

jobs:
  # The Build workflow uploads a release gate artifact only for commits that should be
  # released, so its absence is the normal outcome and quietly stops here.
  #
  # Build's own event is not checked: on main Build is itself triggered by a green Test run,
  # so its event is workflow_run rather than push, and only that path uploads a gate.
  gate:
    name: Gate
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to read the artifacts of the Build run that triggered this workflow.
      actions: read
      statuses: write
    outputs:
      should-proceed: ${{ steps.gate.outputs.should-proceed }}
      package-version: ${{ steps.gate.outputs.package-version }}
      package-version-is-prerelease: ${{ steps.gate.outputs.package-version-is-prerelease }}
      swift-package-binary-name: ${{ steps.gate.outputs.swift-package-binary-name }}
      expected-zip-count: ${{ steps.gate.outputs.expected-zip-count }}
      head-sha: ${{ steps.gate.outputs.head-sha }}
      swift-has-build-artifacts: ${{ steps.gate.outputs.swift-has-build-artifacts }}

    steps:
      # `$/` runs the action from this repository at the commit this workflow was loaded
      # from, so the job needs no checkout of its own.
      - name: Read release gate
        id: gate
        uses: $/.github/actions/release/gate/
        with:
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set in-progress commit status
        if: ${{ steps.gate.outputs.should-proceed == 'true' }}
        uses: $/.github/actions/report-commit-status/
        with:
          state: pending
          sha: ${{ steps.gate.outputs.head-sha }}
          description: In progress

  release:
    name: Release ${{ needs.gate.outputs.package-version }}
    needs:
      - gate
    if: ${{ needs.gate.outputs.should-proceed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required by actions/attest-build-provenance to sign the attestation.
      id-token: write
      attestations: write
      # Required to read the artifacts of the Build run that triggered this workflow.
      actions: read
      statuses: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.gate.outputs.package-version }}
      IS_PRERELEASE: ${{ needs.gate.outputs.package-version-is-prerelease }}
      ARTIFACTS_DIR: artifacts
      SWIFT_HAS_BUILD_ARTIFACTS: ${{ needs.gate.outputs.swift-has-build-artifacts }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The commit the archives were built from, as recorded by the Build run that
          # produced them.
          ref: ${{ needs.gate.outputs.head-sha }}
          fetch-depth: 1

      - name: Download release archives
        uses: actions/download-artifact@v8
        if: ${{ needs.gate.outputs.swift-has-build-artifacts == 'true' }}
        with:
          pattern: binaries-*
          merge-multiple: true
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      # Runs before the release exists: a missing archive or a bad checksum must not reach
      # a release that cannot be corrected afterwards.
      - name: Verify release archives
        run: ./.github/workflows/scripts/release/expect-release-assets.bash
        if: ${{ needs.gate.outputs.swift-has-build-artifacts == 'true' }}
        env:
          SWIFT_PACKAGE_BINARY_NAME: ${{ needs.gate.outputs.swift-package-binary-name }}
          EXPECTED_ZIP_COUNT: ${{ needs.gate.outputs.expected-zip-count }}

      - name: Create draft release
        id: create-release
        run: ./.github/workflows/scripts/release/create-release.bash
        env:
          HEAD_SHA: ${{ needs.gate.outputs.head-sha }}
          SWIFT_HAS_BUILD_ARTIFACTS: ${{ needs.gate.outputs.swift-has-build-artifacts }}

      # Attests the archives users download; the checksum sidecars are only helpers.
      - name: Attest release archives
        if: ${{ steps.create-release.outputs.created == 'true' && needs.gate.outputs.swift-has-build-artifacts == 'true' }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts/*.zip

      # Publishing creates the tag and, with immutable releases, locks the assets, so it
      # happens only once the release is complete and attested.
      - name: Publish release
        if: ${{ steps.create-release.outputs.created == 'true' }}
        run: ./.github/workflows/scripts/release/publish-release.bash

      - name: Clean up draft release
        if: ${{ failure() || cancelled() }}
        run: ./.github/workflows/scripts/release/cleanup-draft-release.bash

      - name: Report commit status
        if: always()
        uses: $/.github/actions/report-commit-status/
        with:
          sha: ${{ needs.gate.outputs.head-sha }}
          description: ${{ job.status == 'success' && format('Released {0}', needs.gate.outputs.package-version) || 'Release failed' }}
