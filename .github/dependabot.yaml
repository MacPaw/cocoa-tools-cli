# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "quarterly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    ignore:
      # Dependabot cannot clone this private repository, and one unreachable
      # dependency fails the whole github-actions run. The action is pinned to a
      # branch, so there is no version for Dependabot to bump either way.
      - dependency-name: "MacPaw/.github-private/*"
