paths:
  # Glob pattern relative to the repository root for matching files. The path separator is always '/'.
  # This example configures any YAML file under the '.github/workflows/' directory.
  .github/workflows/**/*.{yml,yaml}:
    # List of regular expressions to filter errors by the error messages.
    ignore:
      # Ignore the specific error
      - "label \"ubuntu-26.04-arm\" is unknown"
      # `uses: $/<path>/` runs an action from this repository at the commit the workflow was
      # loaded from, without a checkout. actionlint 1.7.12 does not know the syntax yet and
      # reports it as a missing ref.
      - "specifying action \"\\$/.+\" in invalid format because ref is missing"
      - "reusable workflow call \"\\$/.+\" at \"uses\" is not following the format"
      # Preview runner on GitHub is not recognized yet.
      - "label \"xcode-27\" is unknown."
